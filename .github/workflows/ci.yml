name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deployment tests
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Shell and service checks
        run: |
          shellcheck deploy/*.sh
          for script in deploy/*.sh; do bash -n "$script"; done
          sudo mkdir -p /opt/pokemon-card-bot/current/bin
          sudo ln -s /usr/bin/true /opt/pokemon-card-bot/current/bin/node
          sudo install -m 0755 deploy/manage.py /usr/local/sbin/pokemon-card-bot
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer

  arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: Build native ARM64 bundle
        env:
          REVISION: ${{ github.sha }}
        run: bash deploy/build-bundle.sh "$REVISION" "$RUNNER_TEMP/bundle"
      - name: Test bundle on Debian 12 with the service memory limit
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/bundle/pokemon-card-bot-linux-arm64-$REVISION.tar.gz" -C "$RUNNER_TEMP/unpacked"
          chmod 755 "$RUNNER_TEMP" "$RUNNER_TEMP/unpacked"
          docker run --rm --memory=384m --cpus=1 --user 65534:65534 -v "$RUNNER_TEMP/unpacked:/app:ro" -w /tmp debian:bookworm-slim /app/bin/node --max-old-space-size=192 /app/deploy/smoke.mjs
      - name: Build and test optional Docker image
        run: |
          docker build -t card-bot:test .
          docker run --rm --memory=384m --user node --entrypoint node card-bot:test /app/deploy/smoke.mjs
          cp .env.example .env
          docker compose config --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-bundle
          path: ${{ runner.temp }}/bundle/*
          if-no-files-found: error
          retention-days: 7

  publish-arm64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-bundle
          path: bundle
      - name: Publish tested Linux ARM64 bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          short="${REVISION:0:7}"
          version=$(sed -n "s/.*\"version\": \"\([^\"]*\)\".*/\1/p" package.json | head -1)
          stamp=$(date -u +%Y%m%d.%H%M)
          tag="ptcg-discord-bot-${version}.${stamp}-${short}-linux-arm64"
          subject=$(git log -1 --format=%s "$REVISION")
          body=$(git log -1 --format=%b "$REVISION")
          committed=$(git log -1 --format=%cI "$REVISION")
          # Title carries the change, so two releases are distinguishable at a glance.
          title="${subject}"
          {
            printf '%s\n\n' "$subject"
            [ -n "$body" ] && printf '%s\n\n' "$body"
            printf -- '---\n'
            printf -- '- Commit: %s\n' "$REVISION"
            printf -- '- Committed: %s\n' "$committed"
            printf -- '- Built: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf -- '- Checks: application suite on x64 and ARM64, native bundle smoke in Debian 12, Docker image\n'
          } > notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$REVISION" --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
          tarball="pokemon-card-bot-linux-arm64-${REVISION}.tar.gz"
          sha256=$(sha256sum "bundle/${tarball}" | cut -d" " -f1)
          size=$(stat -c%s "bundle/${tarball}")
          release_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf 'version: %s\nfiles:\n  - url: %s\n    sha256: %s\n    size: %s\npath: %s\nreleaseDate: %s\n' \
            "$version" "$tarball" "$sha256" "$size" "$tarball" "$release_date" > bundle/latest.yml
          gh release upload "$tag" bundle/* --clobber
