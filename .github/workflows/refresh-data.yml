name: Refresh card data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One refresh at a time; overlapping runs queue rather than race each other's branch push.
concurrency:
  group: refresh-card-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay off during the generators; Git is configured only at the push step.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run index:sets
      - run: npm run index:text
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/data)" ]; then
            echo "card data unchanged"
            exit 0
          fi
          branch="data/refresh-${{ github.run_id }}"
          if gh pr view "$branch" --json state --jq .state >/dev/null 2>&1; then
            echo "a pull request for $branch already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A previous attempt may have pushed this branch and died before creating
          # its PR; build the PR from the pushed commit instead of pushing over it.
          if git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch" | grep -q "$branch"; then
            gh pr create --head "$branch" --title "data: refresh the generated card indexes" --body "Generated by the card data refresh workflow. Review the record counts and hashes in src/data/data-manifest.json before merging."
            exit 0
          fi
          git checkout -b "$branch"
          git add src/data/set-index.ts src/data/text-index.json src/data/data-manifest.json
          git commit -m "data: refresh the generated card indexes"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
          gh pr create --head "$branch" --title "data: refresh the generated card indexes" --body "Generated by the card data refresh workflow. Review the record counts and hashes in src/data/data-manifest.json before merging."
