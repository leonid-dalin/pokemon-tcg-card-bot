name: Refresh card data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run index:sets
      - run: npm run index:text
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/data)" ]; then
            echo "card data unchanged"
            exit 0
          fi
          branch="data/refresh-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data
          git commit -m "data: refresh the generated card indexes"
          git push -u origin "$branch"
          gh pr create --title "data: refresh the generated card indexes" --body "Generated by the card data refresh workflow. Review the record counts and hashes in src/data/data-manifest.json before merging."
